<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<defs>
<radialGradient id="bg" cx="50%" cy="38%" r="80%"><stop offset="0" stop-color="#0E2D4D"/><stop offset=".55" stop-color="#061629"/><stop offset="1" stop-color="#02070F"/></radialGradient>
<radialGradient id="halo" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#22D3EE" stop-opacity=".35"/><stop offset=".6" stop-color="#22D3EE" stop-opacity=".08"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
<linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF3C4"/><stop offset=".45" stop-color="#F5C451"/><stop offset="1" stop-color="#B7791F"/></linearGradient>
<linearGradient id="cy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E0FBFF"/><stop offset=".5" stop-color="#67E8F9"/><stop offset="1" stop-color="#0891B2"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<rect width="512" height="512" fill="url(#bg)"/>
<circle cx="256" cy="256" r="240" fill="url(#halo)"/>
<!-- stars -->
<g fill="#CFFAFE" opacity=".55"><circle cx="70" cy="80" r="2"/><circle cx="440" cy="60" r="1.6"/><circle cx="460" cy="400" r="1.8"/><circle cx="52" cy="430" r="1.4"/><circle cx="120" cy="40" r="1.2"/><circle cx="400" cy="120" r="1.1"/></g>
<!-- outer HUD ring -->
<circle cx="256" cy="256" r="206" fill="none" stroke="#22D3EE" stroke-opacity=".28" stroke-width="3"/>
<circle cx="256" cy="256" r="190" fill="none" stroke="url(#cy)" stroke-width="10" stroke-dasharray="70 22" stroke-linecap="round" filter="url(#glow)" transform="rotate(-12 256 256)"/>
<circle cx="256" cy="256" r="168" fill="none" stroke="#67E8F9" stroke-opacity=".45" stroke-width="2" stroke-dasharray="3 9"/>
<!-- tick marks -->
<g stroke="#A5F3FC" stroke-width="4" stroke-linecap="round" opacity=".8">
<line x1="256" y1="36" x2="256" y2="54"/><line x1="256" y1="458" x2="256" y2="476"/><line x1="36" y1="256" x2="54" y2="256"/><line x1="458" y1="256" x2="476" y2="256"/></g>
<!-- inner disc -->
<circle cx="256" cy="256" r="150" fill="#04101E" fill-opacity=".75" stroke="#F5C451" stroke-opacity=".55" stroke-width="2.5"/>
<!-- Greek meander band (subtle) -->
<g fill="none" stroke="#F5C451" stroke-opacity=".4" stroke-width="3" transform="translate(6 -4)">
<path d="M176 352h20v-12h-12v-8h20v20h16v-12h-12v-8h20v20h16v-12h-12v-8h20v20h16v-12h-12v-8h20v20h16v-12h-12v-8h20v20"/></g>
<!-- monogram B1 -->
<g filter="url(#glow)">
<text x="256" y="292" text-anchor="middle" font-family="'Cinzel','Trajan Pro','Georgia','Times New Roman',serif" font-weight="700" font-size="150" letter-spacing="-4" fill="url(#gold)">B<tspan fill="url(#cy)">1</tspan></text>
</g>
<!-- spark on the ring -->
<circle cx="390" cy="122" r="7" fill="#F0FDFF" filter="url(#glow)"/>
</svg>
