<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jarvis Field Book</title>
<meta name="theme-color" content="#0B3A32">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jarvis">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="style.css">
<style>
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; -webkit-text-size-adjust: 100%; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div id="login" class="welcome login-screen" hidden>
  <div class="wl-glow" aria-hidden="true"></div>
  <svg class="wl-acropolis" viewBox="0 0 240 130" aria-hidden="true"><path pathLength="1" d="M0 126c30-14 60-20 120-20s90 6 120 20"/><path pathLength="1" d="M28 104h184M36 98h168M44 92h152"/><path pathLength="1" d="M58 92V50M75 92V50M92 92V50M109 92V50M126 92V50M143 92V50M160 92V50M177 92V50"/><path pathLength="1" d="M50 50h140M48 44h144M54 44l66-26 66 26"/><path pathLength="1" d="M120 18V8M116 8h8"/></svg>
  <div class="wl-brand wl-in" style="--d:.1s"><img src="icons/icon.svg" alt="" width="44" height="44"><span>Jarvis</span></div>
  <div class="wl-mid">
    <h1 class="wl-in" style="--d:.25s">Καλώς ήρθες</h1>
    <p class="wl-sub wl-in" style="--d:.35s">Ο βοηθός σου για τα μαγαζιά, τις επισκέψεις και την αγορά. Συνδέσου για να συνεχίσεις.</p>
    <form id="login-form" class="wl-card wl-form wl-in" style="--d:.45s">
      <label class="field">Email<input id="login-email" type="email" autocomplete="username" required></label>
      <label class="field">Κωδικός<input id="login-pass" type="password" autocomplete="current-password" minlength="8" required></label>
      <button class="wl-btn primary" type="submit" id="login-go">Σύνδεση</button>
      <button class="wl-link" type="button" id="signup-go">Νέος λογαριασμός</button>
      <p class="small" id="login-msg" role="status"></p>
    </form>
  </div>
</div>
<div id="welcome" class="welcome" hidden>
  <div class="wl-glow" aria-hidden="true"></div>
  <svg class="wl-acropolis" viewBox="0 0 240 130" aria-hidden="true"><path pathLength="1" d="M0 126c30-14 60-20 120-20s90 6 120 20"/><path pathLength="1" d="M28 104h184M36 98h168M44 92h152"/><path pathLength="1" d="M58 92V50M75 92V50M92 92V50M109 92V50M126 92V50M143 92V50M160 92V50M177 92V50"/><path pathLength="1" d="M50 50h140M48 44h144M54 44l66-26 66 26"/><path pathLength="1" d="M120 18V8M116 8h8"/></svg>
  <div class="wl-brand wl-in" style="--d:.1s"><img src="icons/icon.svg" alt="" width="44" height="44"><span>Jarvis</span></div>
  <div class="wl-mid">
    <span class="wl-date wl-in" style="--d:.2s" id="wl-date"></span>
    <h1 class="wl-in" style="--d:.3s" id="wl-greet">Καλώς ήρθες</h1>
    <p class="wl-sub wl-in" style="--d:.4s" id="wl-sub">Ο βοηθός σου για τα μαγαζιά της Αθήνας.</p>
    <div class="wl-cards wl-in" style="--d:.55s" id="wl-cards"></div>
    <p class="wl-tip wl-in" style="--d:.7s" id="wl-tip"></p>
  </div>
  <div class="wl-actions wl-in" style="--d:.8s">
    <button class="wl-btn primary" type="button" data-wl="enter">Ξεκίνα τη μέρα <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    <button class="wl-btn glass" type="button" data-wl="talk"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/><path d="M18 11a6 6 0 0 1-12 0M12 17v4"/></svg>Μίλα στον Jarvis</button>
  </div>
</div>
<div id="shell" hidden>


<header class="top"><div class="wrap">
  <button class="icon-btn hdr-back" id="hdr-back" data-action="back" aria-label="Πίσω" hidden><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <div class="hdr-title"><span class="hdr-eyebrow" id="hdr-eyebrow"></span><span id="hdr-title">Jarvis</span></div>
  <div class="hdr-right"><span id="hdr-actions"></span><span id="sync-dot" title="Συγχρονισμένο"></span></div>
</div></header>

<main class="wrap" id="app">
  <p class="muted">Φορτώνω τα μαγαζιά σου…</p>
</main>
<div id="lightbox-root"></div>
<div id="talk-root"></div>

<nav class="tabs" aria-label="Ενότητες"><div class="wrap">
  <a href="#today" data-tab="today"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg>Αρχική</a>
  <a href="#shops" data-tab="shops"><svg viewBox="0 0 24 24"><path d="M4 10l1.5-5h13L20 10M4 10v10h16V10M4 10h16M9 20v-5h6v5"/></svg>Μαγαζιά</a>
  <button class="nav-talk" id="fab" type="button" aria-label="Μίλα στον Jarvis"><span class="talk-circle"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-2.1A7 7 0 0 0 19 12z"/></svg></span>Μίλα</button>
  <a href="#agenda" data-tab="agenda"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Ατζέντα<span id="task-badge"></span></span></a>
  <a href="#more" data-tab="more"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>Άλλα</a>
</div></nav>


</div>
<script type="module">
import { sb } from "./data.js";
import { startApp } from "./app.js";
const $ = (id) => document.getElementById(id);
const show = (signedIn) => { $("login").hidden = signedIn; $("shell").hidden = !signedIn; };
let started = false;
async function boot(session) { if (!session || started) return; started = true; show(true); await startApp(session); }
const { data } = await sb.auth.getSession();
if (data.session) boot(data.session); else show(false);
sb.auth.onAuthStateChange((_e, session) => { if (session) boot(session); });
async function auth(kind) {
  const email = $("login-email").value.trim(), password = $("login-pass").value;
  if (!email || password.length < 8) { $("login-msg").textContent = "Γράψε το email σου και κωδικό τουλάχιστον 8 χαρακτήρων."; return; }
  $("login-msg").textContent = kind === "up" ? "Δημιουργία λογαριασμού…" : "Σύνδεση…";
  const { data, error } = kind === "up" ? await sb.auth.signUp({ email, password }) : await sb.auth.signInWithPassword({ email, password });
  if (error) { $("login-msg").textContent = error.message; return; }
  if (kind === "up" && !data.session) $("login-msg").textContent = "Άνοιξε το email σου, πάτα τον σύνδεσμο επιβεβαίωσης και μετά συνδέσου εδώ.";
}
$("login-form").addEventListener("submit", (e) => { e.preventDefault(); auth("in"); });
$("signup-go").addEventListener("click", () => auth("up"));
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
