<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jarvis Field Book</title>
<meta name="theme-color" content="#0F4A40">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jarvis">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="style.css">
<style>
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; -webkit-text-size-adjust: 100%; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div id="login" class="login" hidden>
  <img class="login-logo" src="icons/icon.svg" alt="" width="72" height="72">
  <h1>Jarvis</h1>
  <span class="eyebrow">Your field sales sidekick</span>
  <p class="muted">Sign in to see your shops. Your data is private to your account.</p>
  <form id="login-form" class="panel inline-form">
    <label class="field">Email<input id="login-email" type="email" autocomplete="username" required></label>
    <label class="field">Password<input id="login-pass" type="password" autocomplete="current-password" minlength="8" required></label>
    <div class="row-actions"><button class="btn primary" type="submit" id="login-go">Sign in</button><button class="btn" type="button" id="signup-go">Create account</button></div>
    <p class="muted small" id="login-msg" role="status"></p>
  </form>
</div>
<div id="shell" hidden>


<header class="top"><div class="wrap">
  <button class="icon-btn hdr-back" id="hdr-back" data-action="back" aria-label="Back" hidden><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <div class="hdr-title"><span class="hdr-eyebrow" id="hdr-eyebrow"></span><span id="hdr-title">Jarvis</span></div>
  <div class="hdr-right"><span id="hdr-actions"></span><span id="sync-dot" title="Synced"></span></div>
</div></header>

<main class="wrap" id="app">
  <p class="muted">Loading your shops…</p>
</main>
<div id="lightbox-root"></div>
<div id="talk-root"></div>

<nav class="tabs" aria-label="Sections"><div class="wrap">
  <a href="#today" data-tab="today"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg>Home</a>
  <a href="#shops" data-tab="shops"><svg viewBox="0 0 24 24"><path d="M4 10l1.5-5h13L20 10M4 10v10h16V10M4 10h16M9 20v-5h6v5"/></svg>Shops</a>
  <button class="nav-talk" id="fab" type="button" aria-label="Talk to Jarvis"><span class="talk-circle"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-2.1A7 7 0 0 0 19 12z"/></svg></span>Talk</button>
  <a href="#agenda" data-tab="agenda"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Agenda<span id="task-badge"></span></span></a>
  <a href="#more" data-tab="more"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>More</a>
</div></nav>


</div>
<script type="module">
import { sb } from "./data.js";
import { startApp } from "./app.js";
const $ = (id) => document.getElementById(id);
const show = (signedIn) => { $("login").hidden = signedIn; $("shell").hidden = !signedIn; };
let started = false;
async function boot(session) { if (!session || started) return; started = true; show(true); await startApp(session); }
const { data } = await sb.auth.getSession();
if (data.session) boot(data.session); else show(false);
sb.auth.onAuthStateChange((_e, session) => { if (session) boot(session); });
async function auth(kind) {
  const email = $("login-email").value.trim(), password = $("login-pass").value;
  if (!email || password.length < 8) { $("login-msg").textContent = "Enter your email and a password of at least 8 characters."; return; }
  $("login-msg").textContent = kind === "up" ? "Creating your account…" : "Signing in…";
  const { data, error } = kind === "up" ? await sb.auth.signUp({ email, password }) : await sb.auth.signInWithPassword({ email, password });
  if (error) { $("login-msg").textContent = error.message; return; }
  if (kind === "up" && !data.session) $("login-msg").textContent = "Check your email and tap the confirmation link, then sign in here.";
}
$("login-form").addEventListener("submit", (e) => { e.preventDefault(); auth("in"); });
$("signup-go").addEventListener("click", () => auth("up"));
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
